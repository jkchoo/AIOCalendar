<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Device Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">

<div class="container py-4">
	
  <h1 class="mb-4">Device Control Panel</h1> 
  
  <!-- Alert Message -->
  <div id="messageArea" class="alert d-none" role="alert"></div>

  <div class="card mb-4">
    <div class="card-header">Motion Control</div>
    <div class="card-body">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" id="motionToggle">
        <label class="form-check-label" for="motionToggle">Enable motion detection screen wakeup?</label>
      </div>

      <label for="motionThresholdSlider" class="form-label mt-3">Motion sensetivity: <span id="motionThresholdValue"></span></label>
      <input type="range" class="form-range" id="motionThresholdSlider" min="0" max="15">
	  <div class="d-flex justify-content-between">
		<span>High</span>
		<span>Low</span>
	  </div>
	</div>
  </div>

  <div class="card mb-4">
    <div class="card-header">Screen Settings</div>
    <div class="card-body">
      <label for="screenBrightnessSlider" class="form-label">Brightness: <span id="screenBrightnessValue"></span></label>
      <input type="range" class="form-range" id="screenBrightnessSlider" min="0" max="255">
	  <br />
	  <label for="screenTimeoutSlider" class="form-label">Timeout: <span id="timeoutValue"></span></label>
      <input type="range" class="form-range" id="screenTimeoutSlider" min="0" max="255">
    </div>
  </div>
	<!-- Buttons -->
	<div class="col-md-6 d-grid">
		<button class="btn btn-success" onclick="setThreshold()">Set Threshold</button>
	</div>
	<div class="col-md-6 d-grid">
		<button class="btn btn-warning" onclick="setBrightness()">Set Brightness</button>
	</div>

	<div class="col-md-6 d-grid">
		<button class="btn btn-primary" onclick="runUpdate()">Run Update</button>
	</div>
	</div>
</div>

<script>
	const motionEnable = document.getElementById('motionToggle');
	const motionThresholdSlider = document.getElementById('motionThresholdSlider');
	const screenBrightnessSlider = document.getElementById('screenBrightnessSlider');
	const screenTimeoutSlider = document.getElementById('screenTimeoutSlider');
	
	// Add an event listener to handle enabling or disabling the motion
	motionEnable.addEventListener('click', () => {
		let motionEnabled = motionEnable.checked;
		let motionURL = '';
		if(motionEnabled) {
			motionURL = '/motion/enable';
		}
		else {
			motionURL = '/motion/disable';
		}
		fetch(motionURL, {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
		})
		.then(res => res.text())
		.then(data => showMessage(data, 'success'))
		.then(data => motionThresholdSlider.disabled = !motionEnabled)
		.catch(err => showMessage('Failed to set threshold: ' + err, 'danger'));
	});

	motionThresholdSlider.addEventListener('input', () => {
	  document.getElementById('motionThresholdValue').textContent = motionThresholdSlider.value;
	});
  
	screenBrightnessSlider.addEventListener('input', () => {
	  document.getElementById('screenBrightnessValue').textContent = screenBrightnessSlider.value;
	});

	function showMessage(message, type = 'info') {
	  const alertBox = document.getElementById('messageArea');
	  alertBox.className = `alert alert-${type}`;
	  alertBox.textContent = message;
	  alertBox.classList.remove('d-none');
	  setTimeout(() => alertBox.classList.add('d-none'), 5000);
	}
  
	function setThreshold() {
	  fetch('/motion/threshold', {
		method: 'POST',
		headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify({ threshold: parseInt(motionThresholdSlider.value) })
	  })
	  .then(res => res.text())
	  .then(data => showMessage(data, 'success'))
	  .catch(err => showMessage('Failed to set threshold: ' + err, 'danger'));
	}
  
	function setBrightness() {
	  fetch('/screen/brightness', {
		method: 'POST',
		headers: { 'Content-Type': 'application/json' },
		body: JSON.stringify({ brightness: parseInt(screenBrightnessSlider.value) })
	  })
	  .then(res => res.text())
	  .then(data => showMessage(data, 'success'))
	  .catch(err => showMessage('Failed to set brightness: ' + err, 'danger'));
	}
  
	function runUpdate() {
	  fetch('/update', { method: 'POST' })
		.then(res => res.text())
		.then(data => showMessage(data, 'info'))
		.then(function() {
			setTimeout(function() {
				window.location = window.location;
			}, 5000)
		})
		.catch(err => showMessage('Update failed: ' + err, 'danger'));
	}
  
	// 🔁 Initialize brightness slider from endpoints
	async function initScreenBrightnessSlider() {
		try {
			const res = await fetch('/screen/brightness');

			if (!res.ok) {
				let errorMsg = `Server returned ${res.status} ${res.statusText}`;
				try {
					const errorData = await res.json();
					if (errorData && errorData.error) {
						errorMsg = `Server returned ${errorData.error}`;
					}
				} catch (parseErr) {
					// JSON parsing failed — keep default errorMsg
				}
				screenBrightnessSlider.disabled = true;
				showMessage('Error loading brightness settings: ' + errorMsg, 'danger');
				return;
			}

			const data = await res.json();

			screenBrightnessSlider.max = data.max;
			screenBrightnessSlider.value = data.current;
			document.getElementById('screenBrightnessValue').textContent = data.current;
		} catch (err) {
			screenBrightnessSlider.disabled = true;
			showMessage('Error loading brightness settings: ' + err.message, 'danger');
		}
	}

	// Initialize Screen Timeout Slider
	async function initScreenTimeoutSlider() {
		try {
		// Fetch screen timeout
		fetch('/screen/timeout')
			.then(res => res.json())
			.then(data => {
				document.getElementById('screenTimeoutSlider').value = data.timeout;
			})
			.catch(console.error);
		} 
		catch (err) {
			showMessage('Error loading screentimeout settings: ' + err, 'danger');
		}
	}

	// Initialize the Motion configurations
	async function initMotion() {
		try{
			
			// Fetch current motion.py state
			fetch('/motion/config')
			.then(res => res.json())
			.then(data => {
				document.getElementById('motionToggle').checked = data.enabled;
				if(!data.enabled) {
					motionThresholdSlider.disabled = true;
				}
				motionThresholdSlider.value = data.threshold;
			})
			.catch(console.error);
		} catch(err) {
			showMessage('Error loading screentimeout settings: ' + err, 'danger');
		}
	}
	
	// On page load
	window.addEventListener('DOMContentLoaded', () => {
	  initScreenBrightnessSlider();
	  initScreenTimeoutSlider();
	  initMotion();
	});
	
</script>

</body>
</html>
